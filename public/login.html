<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCC — Panel Giris</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#09090b;--card:#111113;--border:#27272a;--text:#fafafa;--text-dim:#a1a1aa;--text-muted:#71717a;--accent:#22c55e;--accent-dim:#16a34a;--accent-glow:rgba(34,197,94,.15);--red:#ef4444;--red-dim:rgba(239,68,68,.15);--radius:12px;--radius-sm:8px}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;}
    .bg-glow{position:fixed;top:-150px;left:50%;transform:translateX(-50%);width:500px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.08) 0%,transparent 70%);filter:blur(40px);}
    .login-box{position:relative;z-index:1;width:100%;max-width:400px;padding:0 24px;}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;position:relative;overflow:hidden;}
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-dim));}
    .logo{text-align:center;margin-bottom:28px;}
    .logo-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent);display:inline-block;margin-bottom:12px;}
    .logo h2{font-size:1.3rem;font-weight:700;}
    .logo p{font-size:.85rem;color:var(--text-muted);margin-top:4px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;}
    .input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:var(--radius-sm);font-size:.9rem;outline:none;font-family:'Inter',sans-serif;transition:border .2s;}
    .input:focus{border-color:var(--accent);}
    .input.mono{font-family:'JetBrains Mono',monospace;}
    .login-btn{width:100%;background:var(--accent);color:#000;border:none;padding:12px;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px;}
    .login-btn:hover{background:var(--accent-dim);}
    .login-btn:disabled{opacity:.5;cursor:not-allowed;}
    .error-msg{background:var(--red-dim);border:1px solid rgba(239,68,68,.2);color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:.85rem;margin-bottom:16px;display:none;}
    .back-link{text-align:center;margin-top:20px;}
    .back-link a{color:var(--text-muted);text-decoration:none;font-size:.85rem;transition:color .2s;}
    .back-link a:hover{color:var(--accent);}
    .hint{text-align:center;margin-top:16px;font-size:.75rem;color:var(--text-muted);}
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="login-box">
    <div class="login-card">
      <div class="logo">
        <div class="logo-dot"></div>
        <h2>VCC API Dashboard</h2>
        <p>Yonetim paneline giris</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label>Kullanici Adi</label>
          <input class="input" id="username" type="text" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label>Sifre</label>
          <input class="input mono" id="password" type="password" placeholder="********" required>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">Giris Yap</button>
      </form>

      <div class="hint">Giris bilgilerini panel yoneticisinden ogrenebilirsin.</div>
    </div>
    <div class="back-link"><a href="/">Ana Sayfaya Don</a></div>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.disabled = true; btn.textContent = 'Giris yapiliyor...';
      err.style.display = 'none';
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const d = await r.json();
        if (d.success) {
          window.location.href = d.redirect;
        } else {
          err.textContent = d.message; err.style.display = 'block';
        }
      } catch(e) {
        err.textContent = 'Baglanti hatasi'; err.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Giris Yap';
    }
  </script>
</body>
</html>
